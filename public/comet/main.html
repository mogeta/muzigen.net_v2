<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>
    html, body {
        margin: 0;
        padding: 0;
        background: #0f0f19;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }
    canvas {
        image-rendering: pixelated;
        display: block;
    }

    /* Loading overlay */
    #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0f0f19;
        z-index: 9999;
        transition: opacity 0.4s ease-out;
    }
    #loading.hide {
        opacity: 0;
        pointer-events: none;
    }
    .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255,255,255,0.15);
        border-top-color: #8888cc;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    .loading-text {
        margin-top: 16px;
        color: rgba(255,255,255,0.5);
        font-family: monospace;
        font-size: 12px;
        letter-spacing: 1px;
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>
<script>
    // Detect mode from URL parameter (set by index.html)
    var gameMode = 'mobile';
    (function() {
        var params = new URLSearchParams(window.location.search);
        var m = params.get('mode');
        if (m === 'desktop' || m === 'mobile') {
            gameMode = m;
        }
    })();
    window.gameMode = gameMode;

    // Set canvas CSS based on mode
    var style = document.createElement('style');
    if (gameMode === 'desktop') {
        style.textContent = 'canvas { width: 1536px; height: 1024px; }';
    } else {
        style.textContent = 'canvas { width: 512px; height: 1024px; }';
    }
    document.head.appendChild(style);
</script>
</head>
<body>
<div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Loading...</div>
</div>

<script src="wasm_exec.js"></script>
<script src="wt_bridge.js"></script>
<script>
    if (!WebAssembly.instantiateStreaming) {
        WebAssembly.instantiateStreaming = async (resp, importObject) => {
            const source = await (await resp).arrayBuffer();
            return await WebAssembly.instantiate(source, importObject);
        };
    }

    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("game.wasm"), go.importObject).then(result => {
        // Hide loading overlay once WASM starts
        var el = document.getElementById("loading");
        if (el) {
            el.classList.add("hide");
            setTimeout(function() { el.remove(); }, 400);
        }
        go.run(result.instance);
    });
</script>
</body>
</html>
